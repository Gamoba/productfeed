# Ticks the scheduled product sync. Vercel Hobby only allows daily crons, so
# GitHub Actions does the ticking instead; /api/cron/sync decides per feed
# whether it is due (Settings → Automatic sync).
#
# The same tick drives the Shopify order-archive sync (/api/cron/orders),
# which syncs each Shopify project every 6 hours. Shopify only exposes the
# last 60 days of orders, so this one must never lapse — see
# lib/orderSyncSchedule.ts.
#
# And the scheduled Google Ads performance fetch (/api/cron/google-ads), which
# pulls each connected feed on its own schedule (Settings → Tidsplan).
#
# Needs in the repo settings:
#   secrets.CRON_SECRET  — same value as CRON_SECRET in Vercel
#   vars.APP_URL         — production URL, e.g. https://feed.example.com
#
# GitHub may delay scheduled runs by a few minutes under load.
name: Scheduled product sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-sync
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # Three calls of up to ~5 min each.
    timeout-minutes: 17
    steps:
      - name: Call /api/cron/sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync"
      # always(): a failing product sync must not stop the order archive,
      # which loses data for good if it lapses.
      - name: Call /api/cron/orders
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/orders"
      - name: Call /api/cron/google-ads
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/google-ads"
